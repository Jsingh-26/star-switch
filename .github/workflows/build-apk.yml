name: Android APK (debug-signed, for sideloading)

# Builds the offline Android edition without any secret and keeps the APK as a
# workflow artifact for 30 days; the owner then attaches it to a GitHub release.

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug-signed APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: star-switch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
